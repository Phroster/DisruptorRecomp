; Host hotkeys (read next to DisruptorRecompiled.exe). Actions not listed here keep
; their defaults: F7 savestate menu, Tab fast-forward (hold), F9 fast-forward
; toggle, F6 scanlines, keypad +/- volume.
[KeyMap]
; The runtime's default Ctrl+F also toggled fullscreen, but Left Ctrl is fire and
; F is the psionic power, so using both switched the display mode mid-game.
Fullscreen = Alt+Return
; Default F collides with the psionic power key.
DisplayPerf = F10
