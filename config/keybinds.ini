# DisruptorRecomp keyboard + mouse layout (copied to build\keybinds.ini by
# run.ps1 when that file does not exist yet; edit build\keybinds.ini to
# change it, or delete it to get this layout back).
#
# Mouse look (camera yaw) comes from the mod, not from this file.
# Button functions, verified in the running game:
#   Cross = fire, Square = psionic, L2/R2 = strafe, Up/Down = move,
#   Left/Right = turn, Start = pause.
#   L1 = weapon list, R1 = psionic list: hold, step with Up/Down, release to
#   select; a quick double tap swaps to the previous weapon / power.
# The mouse wheel is handled by the mod (feature "Wheel weapon / psionic
# select"): wheel scrolls the weapons, and with R1 held the psionics; the
# choice is taken a moment after the last notch. DISRUPTOR_WHEEL_SELECT=0
# gives the wheel back to the MouseWheelUp/MouseWheelDown bindings here.
# Each input accepts a second binding after a comma - both assert the input.

[player1]
up        = W, Up
down      = S, Down
left      = Left
right     = Right
cross     = Mouse1, Left Ctrl
circle    = Space
square    = Mouse3, F
triangle  = E
l1        = Q
r1        = R
l2        = A
r2        = D
l3        = None
r3        = None
start     = Return, Escape
select    = Backspace, Right Shift
ls_up     = None
ls_down   = None
ls_left   = None
ls_right  = None
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None

[player2]
up        = Up
down      = Down
left      = Left
right     = Right
cross     = X
circle    = S
square    = Z
triangle  = A
l1        = Q
r1        = W
l2        = E
r2        = R
l3        = T
r3        = Y
start     = Return
select    = Right Shift
ls_up     = None
ls_down   = None
ls_left   = None
ls_right  = None
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None
