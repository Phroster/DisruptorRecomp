# The engine's VBlank wait (func_8004B51C) is
#     do { if (--timeout_on_stack == -1) { timeout path } } while (Vcount < target);
# two basic blocks and a stack store per iteration, which the runtime's idle
# skipper rejects (it needs one resume PC and no stores), so every guest cycle
# spent waiting was executed on the host: 27 percent of host time in a
# profiled scene, and the reason a higher guest overclock cost host CPU.
# Branching back to the Vcount poll (0x8004B590) instead of the timeout
# countdown (0x8004B544) makes it a single store-free block the skipper
# fast-forwards. The dropped countdown only guarded against a VBlank that
# never comes.
[[recompiler.patch]]
id = "vsync-wait-skippable"
address = "0x8004B5A0"
expected = "0x1440FFE8"
replacement = "0x1440FFFB"
note = "bnez v0,0x8004B544 -> bnez v0,0x8004B590 (poll-only wait loop)"

