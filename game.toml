# Gameplay loop limiter (func_80043404, 0x80043E7C..0x80043EB0):
#     VSync(0);                                  <- ONE blocking wait per pass
#     if (VSync(-1) - last < 2) VSync(0);        <- 30 fps limiter
#     ticks = VSync(-1) - last; last = ...       <- logic advances by `ticks`
# 60 fps = keep the first wait, make the limiter "< 1" so its second wait never
# runs. The former "loop-wait-04" patch also turned the FIRST wait into
# VSync(-1); with no wait left the engine free-ran (1.35 passes per VBlank in
# cheap views, extra passes with ticks = 0 -> ~20 % duplicate pictures, and
# doubled host CPU cost under the guest overclock).
[[recompiler.patch]]
id = "fps-cap-60-game"
address = "0x80043E90"
expected = "0x28420002"
replacement = "0x28420001"
note = "gameplay limiter slti 2 -> 1 (one VBlank per pass)"

