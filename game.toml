# NOT patched on purpose: the main loop's first VSync(0) at 0x8002059C/A0 stays
# a real blocking wait. It is the engine's ONE wait per iteration: with it the
# loop runs exactly one update+render pass per VBlank. Turning it into
# VSync(-1) as well (the former "loop-wait-update" patch) let the engine
# free-run: in cheap views it completed 1.3+ passes per VBlank, the extra
# passes advanced 0 ticks, and ~20 % of the presented pictures were duplicates
# (measured: 46-51 new pictures/s while turning, at a steady 60 presents/s).

