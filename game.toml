# --- True 16:9: widen the engine's portal windows (no edge stretch) --------
# Disruptor is a portal renderer. func_8003A0F0 projects each portal's two edge
# points with x*160/z + 160 and clamps the resulting screen window to [0, 320];
# the root sector is drawn with a literal [0, 320]. The terrain renderer
# (func_80046134) drops every polygon whose four corners fall on one side of
# that window, so nothing exists beyond the 4:3 edges. These patches run the
# whole portal pass in coordinates biased by +64 px with the range [0, 448];
# the mod's entry hook on func_80046134 removes the bias, giving real windows
# of [-64, 384] (16:9 shows -53..373). Only immediates change.
# The portal walk itself starts from two frustum rays at yaw +-32 (45 deg =
# the 4:3 field of view) and clips every portal to them BEFORE projecting, so
# the rays are widened to +-39 (54.8 deg, tan = 1.418 -> +-227 px) as well.
