# Sprites (bodies, pickups, enemies, effects) are projected on the CPU by four
# sibling routines, each with its own frustum test in camera space:
#     if (z + margin < x || z + margin < -x) skip;      (x/z = 1 is the 4:3 edge)
# so every sprite vanished once its centre passed the 4:3 edge. The 16:9 edge is
# x/z = 1.33. The same instruction slots now test |x| <= 2z + margin with one
# unsigned compare, (unsigned)(x + B) <= 2B with B = 2z + margin; the first of
# the two branches becomes a plain instruction, the second still jumps to the
# same skip label. 2z keeps x*160/z + 160 inside [-160, 480] plus the margin,
# so nothing can wrap the GPU's 11-bit coordinates that could not before.
# Routine 4 used the same temporary for its vertical test, which is rebuilt the
# same way with its stock bound (|dy| <= z + 64).
[[recompiler.patch]]
id = "ws-sprite-a-0"
address = "0x8003B8E8"
expected = "0x26030020"
replacement = "0x00101840"
note = "v1 = z + 32 -> v1 = 2z"

[[recompiler.patch]]
id = "ws-sprite-a-1"
address = "0x8003B8EC"
expected = "0x0067102A"
replacement = "0x24630020"
note = "slt v0,v1,x -> v1 += 32 (B)"

[[recompiler.patch]]
id = "ws-sprite-a-2"
address = "0x8003B8F0"
expected = "0x144000A8"
replacement = "0x00E31021"
note = "bnez skip -> v0 = x + B"

[[recompiler.patch]]
id = "ws-sprite-a-3"
address = "0x8003B8F4"
expected = "0x00071023"
replacement = "0x00031840"
note = "v0 = -x -> v1 = 2B"

[[recompiler.patch]]
id = "ws-sprite-a-4"
