[runtime]
debug_port = 4624
window_title = "Disruptor Recompiled"
memcard_dir = "saves"
disc_speed = "1x"
bios_hle = false
overlay_cache = true
# Fast-forward the engine's VBlank poll loop (func_8004B51C) instead of
# executing it: needed with the CPU overclock so the wait costs no host time.
idle_skip = true
overlay_backend = "auto"
overlay_autocompile_cmd = 'python "psxrecomp/tools/compile_overlays.py" --captures "build/overlay_captures.json" --game-toml "game.toml" --recompiler ".local/build-recompiler/psxrecomp-game.exe" --runtime-include "psxrecomp/runtime/include" --project-root "." --out-dir "build/cache" --compiler gcc'

[video]
aspect_ratio = "4:3"
renderer = "opengl"
# Internal resolution multiplier (1..4). 4 = 1280x960 for the 320x240 game,
# scaled to the window; rendered on the GPU, so it costs the game thread nothing.
supersampling = 4
antialiasing = false
texture_filtering = "nearest"
# PGXP (needs the PGXP build, CMake DISRUPTOR_PGXP=ON, the default):
# geometry_correction keeps the sub-pixel part of every projected vertex the
# GTE throws away (no more polygon wobble), perspective_texturing interpolates
# textures with depth (no more affine warping on walls and floors).
# Measured in a heavy gameplay view: 97 % of all vertices arrive with a precise
# position (dataflow 23.1 % + fallback 1.2 % accepted, 72.8 % rejected only by
# the 0.5 px clamp below; 0 value mismatches, 0 truncation rejects), and 91 %
# of textured triangles get perspective UVs.
geometry_correction = true
perspective_texturing = true
# The framework default 0.5 discards every vertex whose sub-pixel part exceeds
# half a pixel - a guard for titles with low coverage, where precise and
# snapped vertices would meet along an edge. Coverage here is near total, so
# the clamp would only put three quarters of the wobble back. -1 = off.
pgxp_tolerance = -1.0
# CPU mode also carries precision through the game's own vertex arithmetic:
# 99.8 % of triangle vertices arrive sub-pixel with it, 97.6 % without
# (tools/seam_census.py, gameplay). No measurable cost: 9.9-10.0 ms of host CPU
# per engine pass with it, 10.0-10.8 without (heaviest saved view, headless
# diagnostics build, 300 %). What neither mode can fix - the game's meshes not
# being watertight - is covered by the renderer's crack fill (run.ps1,
# PSX_GL_CRACK_FILL).
pgxp_cpu_mode = true

[controller]
default_mode = "digital"
allow_hybrid = false
lock_mode = true
p1_device = "auto"

[widescreen]
offer = false
offer_ultrawide = false
adaptive_view = false
gte_game_mode = true
native_wide = true
hud_sprt_squash = false
nw_textured_edges = false
nw_textured_edge_scale = 200
nw_full_mirror = false
nw_flat_backdrop = true

[widescreen.cull]
auto_screen_x = true
screen_w_imms = ["0x140", "0x141", "0x180", "0x181"]
screen_h_imms = ["0xEF", "0xF0", "0xF1", "0x1E0"]
